name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild Android source package
        shell: bash
        run: |
          cat source-parts/part*.b64 | tr -d '\r\n' | base64 --decode > remotephone-project-fixed.zip
          unzip -t remotephone-project-fixed.zip
          unzip -o remotephone-project-fixed.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RemotePhone-Direct-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
