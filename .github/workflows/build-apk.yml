name: Build Android Test Artifacts

on:
  push:
    branches: [ main, v0.2 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild Android source package
        shell: bash
        run: |
          cat source-parts/part*.b64 | tr -d '\r\n' | base64 --decode > remotephone-project-fixed.zip
          unzip -t remotephone-project-fixed.zip
          unzip -o remotephone-project-fixed.zip

      - name: Inspect v0.1 Android sources for v0.2 work
        if: github.ref == 'refs/heads/v0.2'
        shell: bash
        run: |
          for f in \
            app/src/main/java/com/remotephone/direct/MainActivity.java \
            app/src/main/java/com/remotephone/direct/ViewerActivity.java \
            app/src/main/java/com/remotephone/direct/HostService.java \
            app/src/main/java/com/remotephone/direct/NetUtil.java; do
            echo "===== SOURCE:$f ====="
            cat "$f"
            echo "===== END:$f ====="
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK and AAB
        run: gradle :app:assembleDebug :app:bundleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RemotePhone-Direct-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: RemotePhone-Direct-debug-aab
          path: app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
