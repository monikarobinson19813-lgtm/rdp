name: Build Android Test Artifacts

on:
  push:
    branches: [ main, v0.2, v0.3, v0.3.1, v0.3.2, v0.3.3, v0.4, v0.4.1 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild Android source package
        shell: bash
        run: |
          cat source-parts/part*.b64 | tr -d '\r\n' | base64 --decode > remotephone-project-fixed.zip
          unzip -t remotephone-project-fixed.zip
          unzip -o remotephone-project-fixed.zip

      - name: Apply v0.2 Android overrides
        if: github.ref == 'refs/heads/v0.2' || github.ref == 'refs/heads/v0.3' || github.ref == 'refs/heads/v0.3.1' || github.ref == 'refs/heads/v0.3.2' || github.ref == 'refs/heads/v0.3.3'
        shell: bash
        run: |
          cp v0.2-overrides/RemoteScreenView.java app/src/main/java/com/remotephone/direct/RemoteScreenView.java
          cp v0.2-overrides/ViewerActivity.java app/src/main/java/com/remotephone/direct/ViewerActivity.java
          cp v0.2-overrides/HostActivity.java app/src/main/java/com/remotephone/direct/HostActivity.java

      - name: Apply v0.3 Android overrides
        if: github.ref == 'refs/heads/v0.3' || github.ref == 'refs/heads/v0.3.1' || github.ref == 'refs/heads/v0.3.2' || github.ref == 'refs/heads/v0.3.3'
        shell: bash
        run: |
          if [ -d v0.3-overrides ]; then
            cp -f v0.3-overrides/*.java app/src/main/java/com/remotephone/direct/
            if [ -f v0.3-overrides/AndroidManifest.xml ]; then
              cp -f v0.3-overrides/AndroidManifest.xml app/src/main/AndroidManifest.xml
            fi
          fi
          grep -q 'import android.widget.Toast;' app/src/main/java/com/remotephone/direct/HostService.java || sed -i '/import android.view.WindowManager;/a import android.widget.Toast;' app/src/main/java/com/remotephone/direct/HostService.java
          cat >> app/build.gradle <<'EOF'

          dependencies {
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          EOF

      - name: Wire v0.6 wake manager into clean baseline
        if: github.ref == 'refs/heads/v0.4' || github.ref == 'refs/heads/v0.4.1'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('v0.5-baseline/app/src/main/java/com/remotephone/direct/ViewerActivity.java')
          s = p.read_text()
          marker = 'private WakeManager wakeManager;'
          if marker not in s:
              replacements = [
                  (
                      '    private RemoteScreenView screen;\n',
                      '    private RemoteScreenView screen;\n    private WakeManager wakeManager;\n'
                  ),
                  (
                      '        setContentView(root);\n\n        saveHost.setOnClickListener(v -> saveCurrentHost());',
                      '        setContentView(root);\n\n        wakeManager = new WakeManager(\n                () -> sendControl(CryptoChannel.CONTROL_WAKE),\n                message -> {\n                    if (remoteStatus != null) remoteStatus.setText(message);\n                });\n\n        saveHost.setOnClickListener(v -> saveCurrentHost());'
                  ),
                  (
                      '        wake.setOnClickListener(v -> {\n            remoteStatus.setText("Waking Host…");\n            sendControl(CryptoChannel.CONTROL_WAKE);\n        });',
                      '        wake.setOnClickListener(v -> wakeManager.requestWake());'
                  ),
                  (
                      '        lastHostState = s;\n        if (!"Host ready".equals(s)) videoStale = false;',
                      '        lastHostState = s;\n        WakeManager wake = wakeManager;\n        if (wake != null) wake.onHostStatus(s);\n        if (!"Host ready".equals(s)) videoStale = false;'
                  ),
                  (
                      '    private void userDisconnect() {\n        manualDisconnect = true;',
                      '    private void userDisconnect() {\n        if (wakeManager != null) wakeManager.cancel();\n        manualDisconnect = true;'
                  ),
                  (
                      '    @Override protected void onDestroy() {\n        destroyed = true;',
                      '    @Override protected void onDestroy() {\n        if (wakeManager != null) wakeManager.cancel();\n        destroyed = true;'
                  ),
              ]
              for old, new in replacements:
                  count = s.count(old)
                  if count != 1:
                      raise SystemExit(f'Expected exactly one wake wiring anchor, found {count}: {old[:80]!r}')
                  s = s.replace(old, new, 1)
              p.write_text(s)
          PY

      - name: Wire v0.6 Host state manager into clean baseline
        if: github.ref == 'refs/heads/v0.4' || github.ref == 'refs/heads/v0.4.1'
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          p = Path('v0.5-baseline/app/src/main/java/com/remotephone/direct/ViewerActivity.java')
          s = p.read_text()
          marker = 'private volatile HostStateManager.State hostUiState'
          if marker not in s:
              state_block = '''    private enum HostUiState {
                  READY, SLEEPING, LOCKED, STREAM_UNAVAILABLE, NEEDS_CAPTURE_APPROVAL, OFFLINE, RECONNECTING
              }
              private volatile HostUiState hostUiState = HostUiState.OFFLINE;'''
              state_replacement = '''    private volatile HostStateManager.State hostUiState = HostStateManager.State.OFFLINE;'''
              if s.count(state_block) != 1:
                  raise SystemExit('Host state enum anchor mismatch')
              s = s.replace(state_block, state_replacement, 1)

              old_mapper = '''    private HostUiState stateFromHostStatus(String s) {
                  if ("Host sleeping".equals(s)) return HostUiState.SLEEPING;
                  if ("Host locked".equals(s)) return HostUiState.LOCKED;
                  if ("Host needs capture approval".equals(s)) return HostUiState.NEEDS_CAPTURE_APPROVAL;
                  if ("Host ready".equals(s)) return HostUiState.READY;
                  return HostUiState.STREAM_UNAVAILABLE;
              }'''
              new_mapper = '''    private HostStateManager.State stateFromHostStatus(String s) {
                  return HostStateManager.fromHostStatus(s);
              }'''
              if s.count(old_mapper) != 1:
                  raise SystemExit('Host state mapper anchor mismatch')
              s = s.replace(old_mapper, new_mapper, 1)

              old_setter = '''    private void setHostUiState(HostUiState state) {
                  hostUiState = state;
                  final String text;
                  switch (state) {
                      case READY: text = "Host ready"; break;
                      case SLEEPING: text = "Host sleeping"; break;
                      case LOCKED: text = "Host locked"; break;
                      case STREAM_UNAVAILABLE: text = "Stream unavailable — Host still online"; break;
                      case NEEDS_CAPTURE_APPROVAL: text = "Host needs capture approval"; break;
                      case RECONNECTING: text = "Reconnecting to Host…"; break;
                      default: text = "Host offline"; break;
                  }
                  runOnUiThread(() -> {
                      if (remoteStatus != null) remoteStatus.setText(text);
                  });
              }'''
              new_setter = '''    private void setHostUiState(HostStateManager.State state) {
                  hostUiState = state;
                  final String text = HostStateManager.controllerLabel(state);
                  runOnUiThread(() -> {
                      if (remoteStatus != null) remoteStatus.setText(text);
                  });
              }'''
              if s.count(old_setter) != 1:
                  raise SystemExit('Host state setter anchor mismatch')
              s = s.replace(old_setter, new_setter, 1)

              dashboard = '''    private String dashboardStatus(String raw) {
                  if ("Host sleeping".equals(raw)) return "Sleeping";
                  if ("Host locked".equals(raw)) return "Locked";
                  if ("Host ready".equals(raw)) return "Online";
                  if ("Host needs capture approval".equals(raw)) return "Online — capture approval";
                  return "Online";
              }'''
              dashboard_replacement = '''    private String dashboardStatus(String raw) {
                  return HostStateManager.dashboardLabel(HostStateManager.fromHostStatus(raw));
              }'''
              if s.count(dashboard) != 1:
                  raise SystemExit('Dashboard state anchor mismatch')
              s = s.replace(dashboard, dashboard_replacement, 1)

              token_replacements = {
                  'HostUiState.RECONNECTING': 'HostStateManager.State.RECONNECTING',
                  'HostUiState.OFFLINE': 'HostStateManager.State.OFFLINE',
                  'HostUiState.STREAM_UNAVAILABLE': 'HostStateManager.State.STREAM_UNAVAILABLE',
                  'HostUiState.NEEDS_CAPTURE_APPROVAL': 'HostStateManager.State.CAPTURE_APPROVAL_REQUIRED',
                  'HostUiState.READY': 'HostStateManager.State.READY',
                  'HostUiState.SLEEPING': 'HostStateManager.State.SLEEPING',
                  'HostUiState.LOCKED': 'HostStateManager.State.LOCKED',
              }
              for old, new in token_replacements.items():
                  s = s.replace(old, new)

              if re.search(r'\bHostUiState\b', s):
                  raise SystemExit('Legacy HostUiState type references remain after wiring')
              p.write_text(s)
          PY

      - name: Use consolidated v0.5 Android baseline
        if: github.ref == 'refs/heads/v0.4' || github.ref == 'refs/heads/v0.4.1'
        shell: bash
        run: |
          test -d v0.5-baseline/app
          rm -rf app
          cp -a v0.5-baseline/app app

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare persistent test signing
        shell: bash
        env:
          RPD_TEST_KEYSTORE_B64: ${{ secrets.RPD_TEST_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${RPD_TEST_KEYSTORE_B64:-}" ]; then
            echo "Persistent test signing secret is not configured"
            exit 1
          fi
          signing_keystore="$RUNNER_TEMP/remotephone-test-signing.jks"
          case "$signing_keystore" in
            "$GITHUB_WORKSPACE"/*)
              echo "Signing keystore path must stay outside the repository workspace"
              exit 1
              ;;
          esac
          printf '%s' "$RPD_TEST_KEYSTORE_B64" | base64 -d > "$signing_keystore"
          chmod 600 "$signing_keystore"
          test -s "$signing_keystore"

      - name: Build debug APK and AAB with persistent test signing
        shell: bash
        env:
          RPD_REQUIRE_TEST_SIGNING: 'true'
          RPD_TEST_KEYSTORE_PATH: ${{ runner.temp }}/remotephone-test-signing.jks
          RPD_TEST_STORE_PASSWORD: ${{ secrets.RPD_TEST_STORE_PASSWORD }}
          RPD_TEST_KEY_ALIAS: ${{ secrets.RPD_TEST_KEY_ALIAS }}
          RPD_TEST_KEY_PASSWORD: ${{ secrets.RPD_TEST_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -s "$RPD_TEST_KEYSTORE_PATH"
          test -n "${RPD_TEST_STORE_PASSWORD:-}"
          test -n "${RPD_TEST_KEY_ALIAS:-}"
          test -n "${RPD_TEST_KEY_PASSWORD:-}"
          gradle :app:assembleDebug :app:bundleDebug --stacktrace

      - name: Remove transient test keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/remotephone-test-signing.jks"

      - name: Commit validated v0.6 Controller wiring
        if: github.ref == 'refs/heads/v0.4'
        shell: bash
        run: |
          if ! git diff --quiet -- v0.5-baseline/app/src/main/java/com/remotephone/direct/ViewerActivity.java; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add v0.5-baseline/app/src/main/java/com/remotephone/direct/ViewerActivity.java
            git commit -m "v0.6: wire validated Host state manager into Controller"
            git push origin HEAD:v0.4
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RemotePhone-Direct-${{ github.ref_name }}-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: RemotePhone-Direct-${{ github.ref_name }}-debug-aab
          path: app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
