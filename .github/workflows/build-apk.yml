name: Build Android Test Artifacts

on:
  push:
    branches: [ main, v0.2, v0.3, v0.3.1, v0.3.2, v0.3.3, v0.4 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild Android source package
        shell: bash
        run: |
          cat source-parts/part*.b64 | tr -d '\r\n' | base64 --decode > remotephone-project-fixed.zip
          unzip -t remotephone-project-fixed.zip
          unzip -o remotephone-project-fixed.zip

      - name: Apply v0.2 Android overrides
        if: github.ref == 'refs/heads/v0.2' || github.ref == 'refs/heads/v0.3' || github.ref == 'refs/heads/v0.3.1' || github.ref == 'refs/heads/v0.3.2' || github.ref == 'refs/heads/v0.3.3'
        shell: bash
        run: |
          cp v0.2-overrides/RemoteScreenView.java app/src/main/java/com/remotephone/direct/RemoteScreenView.java
          cp v0.2-overrides/ViewerActivity.java app/src/main/java/com/remotephone/direct/ViewerActivity.java
          cp v0.2-overrides/HostActivity.java app/src/main/java/com/remotephone/direct/HostActivity.java

      - name: Apply v0.3 Android overrides
        if: github.ref == 'refs/heads/v0.3' || github.ref == 'refs/heads/v0.3.1' || github.ref == 'refs/heads/v0.3.2' || github.ref == 'refs/heads/v0.3.3'
        shell: bash
        run: |
          if [ -d v0.3-overrides ]; then
            cp -f v0.3-overrides/*.java app/src/main/java/com/remotephone/direct/
            if [ -f v0.3-overrides/AndroidManifest.xml ]; then
              cp -f v0.3-overrides/AndroidManifest.xml app/src/main/AndroidManifest.xml
            fi
          fi
          grep -q 'import android.widget.Toast;' app/src/main/java/com/remotephone/direct/HostService.java || sed -i '/import android.view.WindowManager;/a import android.widget.Toast;' app/src/main/java/com/remotephone/direct/HostService.java
          cat >> app/build.gradle <<'EOF'

          dependencies {
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          EOF

      - name: Wire v0.6 wake manager into clean baseline
        if: github.ref == 'refs/heads/v0.4'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('v0.5-baseline/app/src/main/java/com/remotephone/direct/ViewerActivity.java')
          s = p.read_text()
          marker = 'private WakeManager wakeManager;'
          if marker not in s:
              replacements = [
                  (
                      '    private RemoteScreenView screen;\n',
                      '    private RemoteScreenView screen;\n    private WakeManager wakeManager;\n'
                  ),
                  (
                      '        setContentView(root);\n\n        saveHost.setOnClickListener(v -> saveCurrentHost());',
                      '        setContentView(root);\n\n        wakeManager = new WakeManager(\n                () -> sendControl(CryptoChannel.CONTROL_WAKE),\n                message -> {\n                    if (remoteStatus != null) remoteStatus.setText(message);\n                });\n\n        saveHost.setOnClickListener(v -> saveCurrentHost());'
                  ),
                  (
                      '        wake.setOnClickListener(v -> {\n            remoteStatus.setText("Waking Host…");\n            sendControl(CryptoChannel.CONTROL_WAKE);\n        });',
                      '        wake.setOnClickListener(v -> wakeManager.requestWake());'
                  ),
                  (
                      '        lastHostState = s;\n        if (!"Host ready".equals(s)) videoStale = false;',
                      '        lastHostState = s;\n        WakeManager wake = wakeManager;\n        if (wake != null) wake.onHostStatus(s);\n        if (!"Host ready".equals(s)) videoStale = false;'
                  ),
                  (
                      '    private void userDisconnect() {\n        manualDisconnect = true;',
                      '    private void userDisconnect() {\n        if (wakeManager != null) wakeManager.cancel();\n        manualDisconnect = true;'
                  ),
                  (
                      '    @Override protected void onDestroy() {\n        destroyed = true;',
                      '    @Override protected void onDestroy() {\n        if (wakeManager != null) wakeManager.cancel();\n        destroyed = true;'
                  ),
              ]
              for old, new in replacements:
                  count = s.count(old)
                  if count != 1:
                      raise SystemExit(f'Expected exactly one wake wiring anchor, found {count}: {old[:80]!r}')
                  s = s.replace(old, new, 1)
              p.write_text(s)
          PY

      - name: Use consolidated v0.5 Android baseline
        if: github.ref == 'refs/heads/v0.4'
        shell: bash
        run: |
          test -d v0.5-baseline/app
          rm -rf app
          cp -a v0.5-baseline/app app

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK and AAB
        run: gradle :app:assembleDebug :app:bundleDebug --stacktrace

      - name: Commit validated v0.6 wake wiring
        if: github.ref == 'refs/heads/v0.4'
        shell: bash
        run: |
          if ! git diff --quiet -- v0.5-baseline/app/src/main/java/com/remotephone/direct/ViewerActivity.java; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add v0.5-baseline/app/src/main/java/com/remotephone/direct/ViewerActivity.java
            git commit -m "v0.6: wire validated wake manager into Controller"
            git push origin HEAD:v0.4
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RemotePhone-Direct-${{ github.ref_name }}-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: RemotePhone-Direct-${{ github.ref_name }}-debug-aab
          path: app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
